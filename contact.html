<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Sai Orbit</title>
  <meta name="description" content="Get in touch with Sai Orbit — questions, feedback, or partnership inquiries." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo"><span class="logo-icon">🛰️</span><span class="logo-text">Sai <span class="gradient">Orbit</span></span></a>
      <nav class="nav" id="nav">
        <a href="/#tools" class="nav-link">Tools</a>
        <a href="/#features" class="nav-link">Features</a>
        <a href="/#about" class="nav-link">About</a>
        <a href="/contact.html" class="nav-link">Contact</a>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle"><span class="sun">☀️</span><span class="moon">🌙</span></button>
        <button class="menu-toggle" id="menuToggle"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="page-hero">
    <div class="container">
      <h1>Get in <span class="gradient">Touch</span></h1>
      <p>Have a question, suggestion, or partnership idea? We'd love to hear from you.</p>
    </div>
  </section>

  <div class="content">
    <div id="formMessage" class="form-message"></div>

    <form id="contactForm" novalidate>
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required placeholder="How can we help?" />
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Write your message here..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Send Message →</button>
    </form>

    <h2 class="mt-4">Other Ways to Reach Us</h2>
    <p>📧 Email: <a href="mailto:hello@saiorbit.com">hello@saiorbit.com</a></p>
    <p>🌐 Website: <a href="https://saiorbit.com">saiorbit.com</a></p>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      <div class="container">
        <p>© <span id="year"></span> Sai Orbit. All rights reserved.</p>
        <p>Made with ❤️ in India</p>
      </div>
    </div>
  </footer>

  <button class="back-to-top" id="backToTop">↑</button>
  <script src="/js/main.js"></script>
</body>
</html>
